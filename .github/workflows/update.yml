name: Update AdGuard DNS lists

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Convert
        run: python adguard2shadowrocket.py .
      - name: Commit if the filter changed
        run: |
          # Ignore the timestamp line so we only commit real list changes
          if git diff --quiet -I '^# AdGuard DNS filter' -- adguard_dns.domainset adguard_dns_allow.list; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adguard_dns.domainset adguard_dns_allow.list
          git commit -m "Update lists ($(head -1 adguard_dns.domainset | sed 's/^# //'))"
          git push
